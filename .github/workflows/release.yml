name: Release plugin

# Push a tag equal to the manifest version (e.g. 0.4.0, no "v") to publish
# main.js, manifest.json and styles.css as release assets, which is what
# Obsidian downloads for community plugins.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tag matches the manifest
        run: |
          v=$(node -p "require('./manifest.json').version")
          test "$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != manifest $v"; exit 1; }
          test "$(node -p "require('./packages/plugin/manifest.json').version")" = "$v"
      - name: Install the reference lat.md for the parity suite
        run: npm install -g lat.md@0.12.2
      - run: npm run typecheck
      - run: npx vitest run --reporter=dot
      - run: npm run build
      - run: npm run build:cli
      - name: Package the demo vault with the plugin installed
        run: |
          mkdir -p example/.obsidian/plugins/typed-graph
          cp packages/plugin/dist/main.js packages/plugin/dist/manifest.json packages/plugin/dist/styles.css example/.obsidian/plugins/typed-graph/
          rm -rf typed-graph-demo-vault && cp -R example typed-graph-demo-vault
          zip -qr typed-graph-demo-vault.zip typed-graph-demo-vault
      - name: Attest build provenance of the release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            packages/plugin/dist/main.js
            packages/plugin/dist/styles.css
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # The version's CHANGELOG.md section is the body; GitHub's generated PR list is appended after it.
        # A missing section only warns: failing here would leave a tag without the release Obsidian downloads.
        run: |
          if ! node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > release-notes.md; then
            echo "::warning::CHANGELOG.md has no section for ${GITHUB_REF_NAME}; the release gets generated notes only"
            : > release-notes.md
          fi
          gh release create "${GITHUB_REF_NAME}" \
            packages/plugin/dist/main.js packages/plugin/dist/manifest.json packages/plugin/dist/styles.css \
            typed-graph-demo-vault.zip \
            --title "Typed Graph ${GITHUB_REF_NAME}" --notes-file release-notes.md --generate-notes
      - name: Check Obsidian can install the release
        # Obsidian reads manifest.json from main and downloads this release's assets.
        run: |
          for i in 1 2 3 4 5; do node scripts/check-plugin-install.mjs "${GITHUB_REPOSITORY}" && exit 0; sleep 15; done; exit 1
      - name: Publish the tg CLI to npm
        # Needs an NPM_TOKEN secret with publish rights on the @typedgraph scope.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN not set; skipping npm publish"; exit 0; fi
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          npm publish -w @typedgraph/cli --access public
